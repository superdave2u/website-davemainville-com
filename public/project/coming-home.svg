<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A winding sequential path through three stages and nine milestones toward a glowing home, with one entry unlocked, one in progress, and completed milestones behind">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#f3e8d8"/>
    </linearGradient>
    <linearGradient id="hpath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="0.55" stop-color="#4fc3dd"/>
      <stop offset="1" stop-color="#e8a04c"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#hbg)"/>

  <g font-family="Roboto, Arial, sans-serif">
    <text x="60" y="80" font-size="18" font-weight="700" fill="#8a6d3b">STAGE I — ARRIVING</text>
    <text x="390" y="80" font-size="18" font-weight="700" fill="#8a6d3b">STAGE II — EXPLORING</text>
    <text x="730" y="80" font-size="18" font-weight="700" fill="#8a6d3b">STAGE III — RETURNING</text>
  </g>
  <g stroke="#d9c9a8" stroke-dasharray="4 6">
    <line x1="360" y1="40" x2="360" y2="470" stroke-width="2"/>
    <line x1="700" y1="40" x2="700" y2="470" stroke-width="2"/>
  </g>

  <path d="M 70 210 C 160 140, 250 300, 350 240 S 540 120, 640 220 S 800 330, 900 250" fill="none" stroke="url(#hpath)" stroke-width="7" stroke-linecap="round"/>

  <g>
    <g fill="#ffffff" stroke="#4f6bff" stroke-width="4">
      <circle cx="70" cy="210" r="20"/>
      <circle cx="160" cy="176" r="20" stroke="#4fc3dd"/>
      <circle cx="250" cy="252" r="20" stroke="#4fc3dd"/>
    </g>
    <g fill="#4f6bff" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="70" y="215" fill="#ffffff">1</text>
      <text x="160" y="181" fill="#ffffff">2</text>
      <text x="250" y="257" fill="#ffffff">3</text>
    </g>

    <circle cx="350" cy="240" r="26" fill="#4f6bff" stroke="#ffffff" stroke-width="4"/>
    <circle cx="350" cy="240" r="36" fill="none" stroke="#4f6bff" stroke-opacity="0.35" stroke-width="3"/>
    <text x="350" y="246" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="350" y="300" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#3b4a8c">writing now</text>

    <g fill="#ffffff" stroke="#4fc3dd" stroke-width="4">
      <circle cx="470" cy="160" r="20"/>
      <circle cx="560" cy="140" r="20"/>
      <circle cx="640" cy="220" r="20"/>
    </g>
    <g fill="#4fc3dd" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="470" y="165">5</text>
      <text x="560" y="145">6</text>
      <text x="640" y="225">7</text>
    </g>

    <g fill="#ffffff" stroke="#c9b28a" stroke-width="4" stroke-dasharray="5 5">
      <circle cx="760" cy="300" r="20"/>
      <circle cx="830" cy="290" r="20"/>
    </g>
    <g font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#b09767">
      <text x="760" y="305">8</text>
      <text x="830" y="295">9</text>
    </g>
  </g>

  <g transform="translate(905 245)">
    <path d="M -34 6 L 0 -26 L 34 6 Z" fill="#e8a04c"/>
    <rect x="-24" y="6" width="48" height="34" fill="#fdf6ec" stroke="#e8a04c" stroke-width="3"/>
    <rect x="-8" y="16" width="16" height="24" fill="#e8a04c"/>
    <rect x="14" y="14" width="12" height="12" fill="#f6c886"/>
    <circle cx="0" cy="-40" r="4" fill="#e8a04c"/>
    <circle cx="0" cy="-56" r="3" fill="#e8a04c" fill-opacity="0.6"/>
  </g>
  <text x="905" y="322" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#b0762a">coming home</text>

  <g font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="60" y="420" width="900" height="52" rx="12" fill="#ffffff" stroke="#d9c9a8" stroke-width="2"/>
    <text x="84" y="452" fill="#8a6d3b">27 entries · one at a time · next unlocks when the last is finished</text>
    <text x="936" y="452" text-anchor="end" fill="#4f6bff">map ✓ review ✓ export .md</text>
  </g>
</svg>
