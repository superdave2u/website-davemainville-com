<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="Todoist reference tasks flow into a SQLite-backed queue, out to Workflowy, and only then through a safety gate that permits deletion">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#e8ecf8"/>
    </linearGradient>
    <linearGradient id="sqlite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f0"/>
      <stop offset="1" stop-color="#3ba3d0"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#wbg)"/>

  <g font-family="Roboto, Arial, sans-serif">
    <rect x="50" y="90" width="250" height="150" rx="14" fill="#ffffff" stroke="#e44332" stroke-width="3"/>
    <text x="70" y="122" font-size="19" font-weight="700" fill="#c73526">Todoist</text>
    <text x="70" y="146" font-size="14" fill="#8a93a8">tasks labeled</text>
    <rect x="70" y="156" width="86" height="26" rx="13" fill="#fdeceb"/>
    <text x="113" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#c73526">@reference</text>
    <g font-size="13" fill="#57606a">
      <text x="70" y="212">· parent chain all eligible</text>
      <text x="70" y="232">· hashed payload, deduped</text>
    </g>

    <line x1="300" y1="165" x2="352" y2="165" stroke="#3ba3d0" stroke-width="4"/>
    <polygon points="352,165 340,159 340,171" fill="#3ba3d0"/>

    <g>
      <path d="M 370 110 h 150 v 118 a 75 14 0 0 1 -150 0 Z" fill="url(#sqlite)" stroke="#2b81a8" stroke-width="2"/>
      <ellipse cx="445" cy="110" rx="75" ry="14" fill="#c9e8f6" stroke="#2b81a8" stroke-width="2"/>
      <text x="445" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#16607f">SQLite queue</text>
      <g font-size="13" font-weight="600" text-anchor="middle">
        <rect x="390" y="136" width="110" height="22" rx="11" fill="#ffffff" fill-opacity="0.85"/>
        <text x="445" y="151" fill="#16607f">lease 900s</text>
        <rect x="386" y="168" width="118" height="22" rx="11" fill="#ffffff" fill-opacity="0.85"/>
        <text x="445" y="183" fill="#16607f">claim oldest 10</text>
        <rect x="392" y="200" width="106" height="22" rx="11" fill="#ffffff" fill-opacity="0.85"/>
        <text x="445" y="215" fill="#16607f">reclaim/recover</text>
      </g>
    </g>

    <line x1="610" y1="165" x2="662" y2="165" stroke="#2470c7" stroke-width="4"/>
    <polygon points="662,165 650,159 650,171" fill="#2470c7"/>

    <rect x="666" y="90" width="250" height="150" rx="14" fill="#ffffff" stroke="#2470c7" stroke-width="3"/>
    <text x="686" y="122" font-size="19" font-weight="700" fill="#1c5da8">Workflowy</text>
    <g font-size="13" fill="#57606a">
      <text x="686" y="150">· create or update by mapping</text>
      <text x="686" y="170">· #tags mirror labels + project</text>
      <text x="686" y="190">· note carries source link + IDs</text>
      <text x="686" y="210">· 20 req/min token bucket,</text>
      <text x="700" y="228">full-jitter backoff</text>
    </g>

    <rect x="240" y="330" width="540" height="96" rx="14" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
    <g>
      <circle cx="300" cy="378" r="26" fill="#dcfce7" stroke="#1a7f37" stroke-width="3"/>
      <text x="300" y="388" text-anchor="middle" font-size="24" fill="#1a7f37">✓</text>
      <text x="352" y="368" font-size="18" font-weight="700" fill="#166534">Safety gate: delete only after confirmed mirror</text>
      <g font-size="14" fill="#57606a">
        <text x="352" y="392">· deepest-first: children delete before parents</text>
        <text x="352" y="412">· untagged descendant → the parent is retained</text>
      </g>
    </g>

    <g font-size="14" font-weight="600">
      <rect x="820" y="336" width="150" height="30" rx="15" fill="#fdeceb"/>
      <text x="895" y="356" text-anchor="middle" fill="#c73526">Todoist: deleted</text>
      <rect x="820" y="386" width="150" height="30" rx="15" fill="#dcfce7"/>
      <text x="895" y="406" text-anchor="middle" fill="#166534">Workflowy: kept</text>
    </g>
  </g>
</svg>
