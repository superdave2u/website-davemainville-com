<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="Two progress bars side by side, one filling linearly and one with an eased curve, above a Run button">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="fill-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#78dced"/>
    </linearGradient>
    <linearGradient id="fill-e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6a0e9"/>
      <stop offset="1" stop-color="#4fc3dd"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#pbg)"/>

  <g font-family="Roboto, Arial, sans-serif" font-weight="600">
    <text x="60" y="120" font-size="19" fill="#3b4a8c">Linear — uniform over time</text>
    <rect x="60" y="140" width="760" height="44" rx="10" fill="#ffffff" stroke="#c3cbe8" stroke-width="2"/>
    <rect x="60" y="140" width="456" height="44" rx="10" fill="url(#fill-l)"/>
    <rect x="60" y="140" width="760" height="44" rx="10" fill="none" stroke="#3b4a8c" stroke-opacity="0.25" stroke-width="2"/>
    <text x="496" y="169" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end">60%</text>

    <text x="60" y="250" font-size="19" fill="#3b4a8c">Eased (sqrt) — fast start, slow finish</text>
    <rect x="60" y="270" width="760" height="44" rx="10" fill="#ffffff" stroke="#c3cbe8" stroke-width="2"/>
    <rect x="60" y="270" width="621" height="44" rx="10" fill="url(#fill-e)"/>
    <rect x="60" y="270" width="760" height="44" rx="10" fill="none" stroke="#3b4a8c" stroke-opacity="0.25" stroke-width="2"/>
    <text x="661" y="299" font-size="20" font-weight="700" fill="#ffffff" text-anchor="end">77%*</text>
    <text x="836" y="299" font-size="15" font-weight="400" fill="#8a93b8">same moment</text>

    <text x="60" y="380" font-size="17" fill="#8a93b8">Same duration, same elapsed time — different perceived progress.</text>
  </g>

  <g transform="translate(510 440)">
    <rect x="-110" y="-30" width="220" height="60" rx="14" fill="#4f6bff" stroke="#3b55e0" stroke-width="2"/>
    <rect x="-98" y="-22" width="196" height="46" rx="10" fill="#4f6bff" fill-opacity="0.35"/>
    <text x="0" y="8" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Run all</text>
  </g>
</svg>
