<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="The opencode AI coding agent setup: a Codex subscription primary provider with an OpenRouter Auto fallback feeding the opencode serve console on Titan port 4096, running parallel tmux sessions for atlas, red-op, blog and ralph">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#e4eaf0"/>
    </linearGradient>
    <linearGradient id="obp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#3b55e0"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#obg)"/>

  <g font-family="Roboto, Arial, sans-serif">
    <text x="60" y="84" font-size="15" font-weight="700" letter-spacing="2" fill="#3b4a8c">OPENCODE</text>

    <g transform="translate(60 100)">
      <rect width="260" height="150" rx="12" fill="#ffffff" stroke="#2337ff" stroke-width="2.5"/>
      <rect x="0" y="0" width="260" height="30" rx="12" fill="#1a2440"/>
      <text x="130" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9d4f2">CODEX SUBSCRIPTION — PRIMARY</text>
      <rect x="16" y="44" width="118" height="32" rx="6" fill="url(#obp)"/>
      <text x="75" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">gpt-6-luna</text>
      <rect x="16" y="88" width="128" height="24" rx="5" fill="#eef1f8" stroke="#c3cbe8" stroke-width="1"/>
      <text x="80" y="104" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3b4a8c">OAuth sign-in</text>
      <text x="16" y="134" font-size="10" fill="#4a5160">subscription quota · keyless auth</text>
    </g>

    <g transform="translate(60 296)">
      <rect width="240" height="134" rx="12" fill="#ffffff" stroke="#4f6bff" stroke-width="2.5"/>
      <rect x="0" y="0" width="240" height="30" rx="12" fill="#1a2440"/>
      <text x="120" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9d4f2">OPENROUTER AUTO — FALLBACK</text>
      <rect x="16" y="44" width="136" height="28" rx="5" fill="#eef1f8" stroke="#4f6bff" stroke-width="1.5"/>
      <text x="84" y="62" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2337ff">openrouter/auto</text>
      <text x="16" y="94" font-size="10" fill="#4a5160">429 · 5xx → replay</text>
      <text x="16" y="114" font-size="10" fill="#57606a">picks a model per request</text>
    </g>

    <path d="M 134 250 C 134 260, 104 262, 104 273 C 104 284, 134 280, 134 290" fill="none" stroke="#e8a04c" stroke-width="3" stroke-dasharray="7 6"/>
    <polygon points="134,299 127,287 141,287" fill="#e8a04c"/>
    <text x="146" y="277" font-size="10" font-weight="600" fill="#b0762a">cooldown 30 min</text>

    <line x1="304" y1="360" x2="436" y2="360" stroke="#4f6bff" stroke-width="4"/>
    <polygon points="440,360 428,354 428,366" fill="#4f6bff"/>
    <text x="370" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#3b4a8c">replay last message</text>

    <g transform="translate(440 100)">
      <rect width="520" height="330" rx="12" fill="#ffffff" stroke="#4f6bff" stroke-width="2.5"/>
      <rect x="0" y="0" width="520" height="30" rx="12" fill="#1a2440"/>
      <text x="260" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9d4f2">OPENCODE SERVE — TITAN :4096</text>
      <line x1="16" y1="70" x2="504" y2="70" stroke="#c3cbe8" stroke-width="1.5"/>
      <rect x="16" y="44" width="116" height="26" rx="6" fill="#4fc3dd"/>
      <text x="74" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d2b34">atlas</text>
      <rect x="140" y="44" width="116" height="26" rx="6" fill="#eef1f8" stroke="#c3cbe8" stroke-width="1"/>
      <text x="198" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b4a8c">red-op</text>
      <rect x="264" y="44" width="116" height="26" rx="6" fill="#eef1f8" stroke="#c3cbe8" stroke-width="1"/>
      <text x="322" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b4a8c">blog</text>
      <rect x="388" y="44" width="116" height="26" rx="6" fill="#eef1f8" stroke="#c3cbe8" stroke-width="1"/>
      <text x="446" y="61" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b4a8c">ralph</text>

