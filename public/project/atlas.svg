<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="The Atlas homelab: four Proxmox hosts carrying a HA K3s control plane behind a kube-vip address, fed by the Gitea to Actions to registry to Argo CD delivery loop, with Sealed Secrets and monitoring">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#e4eaf0"/>
    </linearGradient>
    <linearGradient id="ak3s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#3b55e0"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#abg)"/>

  <g font-family="Roboto, Arial, sans-serif">
    <text x="60" y="84" font-size="15" font-weight="700" letter-spacing="2" fill="#3b4a8c">4× PROXMOX HOSTS</text>
    <g>
      <g transform="translate(60 100)">
        <rect width="200" height="150" rx="12" fill="#ffffff" stroke="#4f6bff" stroke-width="2.5"/>
        <rect x="0" y="0" width="200" height="30" rx="12" fill="#1a2440"/>
        <text x="100" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9d4f2">PVE · K3s control ×3</text>
        <g fill="url(#ak3s)">
          <rect x="16" y="44" width="52" height="30" rx="5"/>
          <rect x="74" y="44" width="52" height="30" rx="5"/>
          <rect x="132" y="44" width="52" height="30" rx="5"/>
        </g>
        <text x="42" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">etcd</text>
        <text x="100" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">etcd</text>
        <text x="158" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">etcd</text>
        <rect x="16" y="84" width="168" height="26" rx="5" fill="#4fc3dd"/>
        <text x="100" y="101" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d2b34">worker</text>
        <rect x="16" y="118" width="168" height="22" rx="5" fill="#eef1f8" stroke="#c3cbe8" stroke-width="1"/>
        <text x="100" y="133" text-anchor="middle" font-size="10" fill="#3b4a8c">kube-vip API · cert-manager</text>
      </g>
      <g transform="translate(280 100)">
        <rect width="200" height="150" rx="12" fill="#ffffff" stroke="#e8a04c" stroke-width="2.5"/>
        <rect x="0" y="0" width="200" height="30" rx="12" fill="#4a3a14"/>
        <text x="100" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f5d9a4">STORAGE + DNS</text>
        <g font-size="11" fill="#4a5160">
          <text x="16" y="52">TrueNAS NFS dataset</text>
          <text x="16" y="68">→ CSI StorageClass</text>
          <text x="16" y="92">Pi-hole (Ansible-built)</text>
          <text x="16" y="108">ExternalDNS registers</text>
          <text x="16" y="124">every Ingress automatically</text>
        </g>
        <rect x="16" y="128" width="60" height="14" rx="3" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/>
        <text x="46" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b06000">*.atlas.lan</text>
      </g>
    </g>

    <text x="540" y="84" font-size="15" font-weight="700" letter-spacing="2" fill="#2b7f96">DELIVERY LOOP</text>
    <g>
      <g transform="translate(540 100)">
        <rect width="190" height="150" rx="12" fill="#ffffff" stroke="#4fc3dd" stroke-width="2.5"/>
        <rect x="0" y="0" width="190" height="30" rx="12" fill="#123840"/>
        <text x="95" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9fe3f2">GITEA FORGE</text>
        <g font-size="11" fill="#4a5160">
          <text x="14" y="52">push / tag an app</text>
          <text x="14" y="70">Actions runner builds it</text>
          <text x="14" y="88">→ built-in registry</text>
          <text x="14" y="112" font-weight="700" fill="#2b7f96">build job writes the new</text>
          <text x="14" y="128" font-weight="700" fill="#2b7f96">tag back to git</text>
        </g>
      </g>
      <g transform="translate(760 100)">
        <rect width="210" height="150" rx="12" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
        <rect x="0" y="0" width="210" height="30" rx="12" fill="#12361f"/>
        <text x="105" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9fe8b8">ARGO CD · APP-OF-APPS</text>
        <g font-size="11" fill="#4a5160">
          <text x="16" y="52">reconciles desired state</text>
          <text x="16" y="70">Helm values under gitops/</text>
          <text x="16" y="94" font-weight="700" fill="#137333">SealedSecrets decrypt</text>
          <text x="16" y="110" font-weight="700" fill="#137333">inside the cluster only</text>
          <text x="16" y="134" fill="#57606a">Prometheus + Grafana watch</text>
        </g>
      </g>
    </g>

    <path d="M 262 175 h 12 M 482 175 h 12 M 700 175 h 12 M 918 175 h 14" stroke="#4f6bff" stroke-width="0" fill="none"/>
    <line x1="264" y1="175" x2="276" y2="175" stroke="#4f6bff" stroke-width="4"/>
    <line x1="484" y1="175" x2="536" y2="175" stroke="#4f6bff" stroke-width="4"/>
    <polygon points="536,175 524,169 524,181" fill="#4f6bff"/>
    <line x1="734" y1="175" x2="756" y2="175" stroke="#34a853" stroke-width="4"/>
    <polygon points="756,175 744,169 744,181" fill="#34a853"/>
    <path d="M 865 254 C 865 330, 700 380, 480 380 C 300 380, 160 340, 160 254" fill="none" stroke="#e8a04c" stroke-width="3" stroke-dasharray="7 6"/>
    <polygon points="160,246 154,260 168,258" fill="#e8a04c"/>
    <text x="512" y="404" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b0762a">deployed state flows back — the cluster is the deploy target, git is the source of truth</text>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="436" width="900" height="44" rx="22" fill="#ffffff" stroke="#c9d4e2" stroke-width="2"/>
    <text x="510" y="463" font-size="15" font-weight="600" fill="#3b4a8c">SealedSecrets ciphertext is the only secret in the repo — gitleaks guards every commit and the whole history</text>
  </g>
</svg>
