<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A foggy estimate range expanding from a single gut-instinct point into optimistic, most likely, and pessimistic markers, above four slider tracks">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="0.5" stop-color="#e2e8f8"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="fogcloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7d8ec9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rangebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3dd"/>
      <stop offset="0.5" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#e6a0e9"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#fog)"/>

  <g fill="url(#fogcloud)">
    <ellipse cx="760" cy="150" rx="230" ry="80"/>
    <ellipse cx="900" cy="230" rx="180" ry="60"/>
    <ellipse cx="640" cy="240" rx="150" ry="55"/>
    <ellipse cx="840" cy="330" rx="200" ry="70"/>
  </g>

  <g font-family="Roboto, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <line x1="120" y1="170" x2="900" y2="170" stroke="url(#rangebar)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="120" cy="170" r="16" fill="#4fc3dd" stroke="#ffffff" stroke-width="4"/>
    <circle cx="510" cy="170" r="16" fill="#4f6bff" stroke="#ffffff" stroke-width="4"/>
    <circle cx="900" cy="170" r="16" fill="#e6a0e9" stroke="#ffffff" stroke-width="4"/>
    <text x="120" y="215" font-size="21" fill="#2b7f96">Optimistic</text>
    <text x="510" y="215" font-size="21" fill="#3b55e0">Most Likely</text>
    <text x="880" y="215" font-size="21" fill="#b56cb9">Pessimistic</text>
    <text x="510" y="112" font-size="22" fill="#3b4a8c">Expected (PERT)</text>
    <text x="510" y="82" font-size="40" font-weight="700" fill="#3b4a8c">H + Δ</text>
  </g>

  <g font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#3b4a8c">
    <g>
      <text x="130" y="320">Expertise (E)</text>
      <line x1="130" y1="340" x2="510" y2="340" stroke="#c3cbe8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="432" cy="340" r="12" fill="#4f6bff" stroke="#ffffff" stroke-width="3"/>
    </g>
    <g>
      <text x="130" y="382">Process Familiarity (F)</text>
      <line x1="130" y1="402" x2="510" y2="402" stroke="#c3cbe8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="462" cy="402" r="12" fill="#4f6bff" stroke="#ffffff" stroke-width="3"/>
    </g>
    <g>
      <text x="560" y="320">Execution Frequency (X)</text>
      <line x1="560" y1="340" x2="940" y2="340" stroke="#c3cbe8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="706" cy="340" r="12" fill="#4f6bff" stroke="#ffffff" stroke-width="3"/>
    </g>
    <g>
      <text x="560" y="382">Clarity of Done (C)</text>
      <line x1="560" y1="402" x2="940" y2="402" stroke="#c3cbe8" stroke-width="10" stroke-linecap="round"/>
      <circle cx="886" cy="402" r="12" fill="#4f6bff" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>

  <g fill="#3b4a8c" fill-opacity="0.15">
    <circle cx="70" cy="470" r="8"/>
    <circle cx="140" cy="455" r="5"/>
    <circle cx="300" cy="470" r="6"/>
    <circle cx="985" cy="470" r="7"/>
  </g>
</svg>
