<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="Glossy bubbles floating on a sky-blue background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e9f5"/>
      <stop offset="0.55" stop-color="#78dced"/>
      <stop offset="1" stop-color="#4fc3dd"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#dff6fb" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#9adcf0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5bc0dd" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
