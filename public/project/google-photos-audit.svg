<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A Google Photos pinwheel beside a browser window showing the storage-message audit — OK when the item is free, REVIEW when it consumes quota — with F8/F9/F10 keycaps and the tally of 30,000 scanned and 12,000 flagged">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#e7edf6"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#gbg)"/>

  <g transform="translate(180 200)">
    <path d="M 0 0 C -95 0 -140 60 -140 128 C -60 120 -12 78 0 0 Z" fill="#4285f4"/>
    <path d="M 0 0 C 0 -95 60 -140 128 -140 C 120 -60 78 -12 0 0 Z" fill="#ea4335"/>
    <path d="M 0 0 C 95 0 140 60 140 128 C 60 120 12 78 0 0 Z" fill="#fbbc04"/>
    <path d="M 0 0 C 0 95 -60 140 -128 140 C -120 60 -78 12 0 0 Z" fill="#34a853"/>
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#d0d7de" stroke-width="3"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#5f6368" stroke-width="4"/>
    <line x1="15" y1="15" x2="36" y2="36" stroke="#5f6368" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="180" y="392" font-size="17" font-weight="600" fill="#3c4043">no API for this signal —</text>
    <text x="180" y="414" font-size="17" font-weight="600" fill="#3c4043">the rendered page is the API</text>
  </g>

  <g>
    <rect x="400" y="70" width="560" height="330" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="400" y="70" width="560" height="42" rx="14" fill="#eceff4"/>
    <circle cx="428" cy="91" r="7" fill="#ea4335"/>
    <circle cx="450" cy="91" r="7" fill="#fbbc04"/>
    <circle cx="472" cy="91" r="7" fill="#34a853"/>
    <rect x="496" y="82" width="380" height="18" rx="9" fill="#f5f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="510" y="96" font-family="Roboto Mono, monospace" font-size="12" fill="#5f6368">photos.google.com/photo/AF1Qip…</text>

    <rect x="430" y="132" width="500" height="120" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
    <text x="450" y="162" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#137333">OK</text>
    <text x="450" y="188" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#1e3a29">“This item doesn't take up space</text>
    <text x="450" y="210" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#1e3a29">in your account storage” — found</text>
    <text x="450" y="236" font-family="Roboto Mono, monospace" font-size="13" fill="#137333">kept on unlimited backup</text>

    <rect x="430" y="266" width="500" height="110" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="450" y="296" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#b06000">REVIEW</text>
    <text x="450" y="322" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#4a3b1c">storage message missing —</text>
    <text x="450" y="344" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#4a3b1c">this item consumes the 15 GB pool</text>
    <text x="450" y="366" font-family="Roboto Mono, monospace" font-size="13" fill="#b06000">queued for offload → Pixel 3 → re-upload</text>
  </g>

  <g font-family="Roboto Mono, monospace" font-size="15" font-weight="700">
    <rect x="400" y="428" width="56" height="40" rx="8" fill="#1a2440"/>
    <text x="428" y="454" text-anchor="middle" fill="#ffffff">F8</text>
    <rect x="466" y="428" width="56" height="40" rx="8" fill="#1a2440"/>
    <text x="494" y="454" text-anchor="middle" fill="#ffffff">F9</text>
    <rect x="532" y="428" width="56" height="40" rx="8" fill="#1a2440"/>
    <text x="560" y="454" text-anchor="middle" fill="#ffffff">F10</text>
    <text x="612" y="454" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#3c4043">scan · scan + advance · repeat N</text>
  </g>
  <g font-family="Roboto, Arial, sans-serif" text-anchor="end">
    <text x="936" y="454" font-size="17" font-weight="700" fill="#1a2440">30,000 scanned · 12,000 flagged</text>
  </g>
</svg>
