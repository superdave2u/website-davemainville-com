<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A consultation replayed: a client speech bubble on the left and a consultant speech bubble on the right, connected over three act cards — R Reveal Your Offer, E Engage and Convert, D Develop Your Audience">
  <defs>
    <linearGradient id="rbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4f4"/>
      <stop offset="1" stop-color="#f3dfdf"/>
    </linearGradient>
    <linearGradient id="rbubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d2626"/>
      <stop offset="1" stop-color="#5d1a1a"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#rbg2)"/>

  <g>
    <rect x="70" y="90" width="380" height="120" rx="16" fill="#2e3440" stroke="#3a4150" stroke-width="2"/>
    <polygon points="120,210 112,238 152,210" fill="#2e3440"/>
    <text x="95" y="122" font-family="Courier New, monospace" font-size="13" letter-spacing="3" fill="#9aa4b5">CLIENT</text>
    <text x="95" y="150" font-family="Georgia, serif" font-size="19" fill="#ece8e2">“Marketing feels like guesswork.</text>
    <text x="95" y="178" font-family="Georgia, serif" font-size="19" fill="#ece8e2">I post when I remember, and hope.”</text>
  </g>

  <g>
    <rect x="570" y="60" width="400" height="120" rx="16" fill="url(#rbubble)" stroke="#c23b3b" stroke-width="2"/>
    <polygon points="920,180 928,208 888,180" fill="#5d1a1a"/>
    <text x="595" y="92" font-family="Courier New, monospace" font-size="13" letter-spacing="3" fill="#e05a5a">CONSULTANT</text>
    <text x="595" y="120" font-family="Georgia, serif" font-size="19" fill="#f2e6e2">“You don't have one problem.</text>
    <text x="595" y="148" font-family="Georgia, serif" font-size="19" fill="#f2e6e2">You have three wearing a trench coat.”</text>
  </g>

  <path d="M 480 260 C 460 285, 520 285, 500 260" fill="none" stroke="#c23b3b" stroke-width="0"/>
  <line x1="250" y1="240" x2="250" y2="292" stroke="#c23b3b" stroke-width="0"/>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(230 310)">
      <rect x="-90" y="-28" width="180" height="120" rx="14" fill="#ffffff" stroke="#c23b3b" stroke-width="2.5"/>
      <text x="0" y="16" font-size="44" font-weight="700" fill="#c23b3b">R</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#8f2020">Reveal</text>
      <text x="0" y="64" font-size="12" fill="#b25c5c">Your Offer</text>
      <text x="0" y="82" font-size="10.5" fill="#b25c5c">client · currency · message</text>
    </g>
    <polygon points="336,370 352,362 352,378" fill="#c9a5a5"/>
    <g transform="translate(510 310)">
      <rect x="-90" y="-28" width="180" height="120" rx="14" fill="#ffffff" stroke="#c23b3b" stroke-width="2.5"/>
      <text x="0" y="16" font-size="44" font-weight="700" fill="#c23b3b">E</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#8f2020">Engage</text>
      <text x="0" y="64" font-size="12" fill="#b25c5c">and Convert</text>
      <text x="0" y="82" font-size="10.5" fill="#b25c5c">magnet · funnel · enrollment</text>
    </g>
    <polygon points="616,370 632,362 632,378" fill="#c9a5a5"/>
    <g transform="translate(790 310)">
      <rect x="-90" y="-28" width="180" height="120" rx="14" fill="#ffffff" stroke="#c23b3b" stroke-width="2.5"/>
      <text x="0" y="16" font-size="44" font-weight="700" fill="#c23b3b">D</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#8f2020">Develop</text>
      <text x="0" y="64" font-size="12" fill="#b25c5c">Your Audience</text>
      <text x="0" y="82" font-size="10.5" fill="#b25c5c">content · retarget · ads</text>
    </g>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <rect x="140" y="446" width="740" height="42" rx="21" fill="#ffffff" stroke="#c23b3b" stroke-width="2"/>
    <text x="510" y="472" font-size="15" font-weight="600" fill="#8f2020">a consultation, replayed — both roles played by the same practitioner</text>
  </g>
</svg>
