<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="An RTX 3090 GPU feeding a cost-versus-quality benchmark scatter with a Pareto frontier, flanked by assistant and content-writing score bars and an immutable evidence badge">
  <defs>
    <linearGradient id="lmbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#e6ebf4"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2029"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="assist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#4fc3dd"/>
    </linearGradient>
    <linearGradient id="content" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a04c"/>
      <stop offset="1" stop-color="#f5c98a"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#lmbg)"/>

  <g transform="translate(200 250)">
    <rect x="-130" y="-120" width="260" height="240" rx="18" fill="url(#gpu)" stroke="#2c333f" stroke-width="2"/>
    <rect x="-112" y="-100" width="224" height="130" rx="10" fill="#0c0f14"/>
    <circle cx="-50" cy="-40" r="34" fill="#232a36"/>
    <circle cx="-50" cy="-40" r="14" fill="#0c0f14"/>
    <circle cx="50" cy="-40" r="34" fill="#232a36"/>
    <circle cx="50" cy="-40" r="14" fill="#0c0f14"/>
    <g stroke="#38455c" stroke-width="3">
      <line x1="-80" y1="50" x2="80" y2="50"/>
      <line x1="-80" y1="68" x2="80" y2="68"/>
      <line x1="-80" y1="86" x2="80" y2="86"/>
    </g>
    <rect x="-60" y="98" width="120" height="18" rx="4" fill="#7aa2ff"/>
    <text x="0" y="158" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#d7def0">RTX 3090</text>
    <text x="0" y="182" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#8b95a8">llama.cpp · llama-swap · local</text>
  </g>

  <g>
    <rect x="360" y="80" width="420" height="300" rx="14" fill="#ffffff" stroke="#c9d2e2" stroke-width="2"/>
    <text x="382" y="112" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b4a8c">COST vs QUALITY — observed Pareto frontier</text>
    <line x1="400" y1="340" x2="740" y2="340" stroke="#c9d2e2" stroke-width="2"/>
    <line x1="400" y1="340" x2="400" y2="120" stroke="#c9d2e2" stroke-width="2"/>
    <path d="M 402 330 C 520 300, 600 250, 720 150" fill="none" stroke="#e8a04c" stroke-width="3" stroke-dasharray="6 5"/>
    <g fill="#4f6bff">
      <circle cx="440" cy="290" r="9"/>
      <circle cx="470" cy="262" r="9"/>
      <circle cx="505" cy="236" r="9"/>
    </g>
    <g fill="#c59a2f">
      <circle cx="560" cy="222" r="8"/>
      <circle cx="610" cy="196" r="8"/>
      <circle cx="650" cy="164" r="8"/>
      <circle cx="690" cy="136" r="8"/>
    </g>
    <g font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="600">
      <circle cx="412" cy="360" r="6" fill="#4f6bff"/>
      <text x="424" y="364" fill="#3b4a8c">local (self-hosted)</text>
      <circle cx="580" cy="360" r="6" fill="#c59a2f"/>
      <text x="592" y="364" fill="#8a6d1f">frontier / API</text>
      <text x="740" y="360" text-anchor="end" fill="#8b95a8" font-weight="400">cost →</text>
    </g>
    <text x="398" y="132" font-family="Roboto, Arial, sans-serif" font-size="11" fill="#8b95a8" transform="rotate(-90 398 132)" text-anchor="end">quality →</text>
  </g>

  <g font-family="Roboto, Arial, sans-serif">
    <text x="810" y="106" font-size="14" font-weight="700" fill="#3b4a8c">TWO SCORES</text>

    <text x="810" y="136" font-size="12" font-weight="600" fill="#4a5160">ASSISTANCE</text>
    <rect x="810" y="146" width="180" height="14" rx="7" fill="#eef1f8"/>
    <rect x="810" y="146" width="104" height="14" rx="7" fill="url(#assist)"/>
    <text x="996" y="158" text-anchor="end" font-size="12" font-weight="700" fill="#3b55e0">58</text>
    <text x="810" y="176" font-size="10.5" fill="#8b95a8">21 tasks · outcome 30% · tool use 25%</text>

    <text x="810" y="206" font-size="12" font-weight="600" fill="#4a5160">CONTENT WRITING</text>
    <rect x="810" y="216" width="180" height="14" rx="7" fill="#eef1f8"/>
    <rect x="810" y="216" width="133" height="14" rx="7" fill="url(#content)"/>
    <text x="996" y="228" text-anchor="end" font-size="12" font-weight="700" fill="#b0762a">74</text>
    <text x="810" y="246" font-size="10.5" fill="#8b95a8">SteadyBurn rubric · argument 40 · action 15</text>

    <rect x="810" y="268" width="180" height="74" rx="10" fill="#dcfce7" stroke="#34a853" stroke-width="2"/>
    <text x="826" y="292" font-size="11.5" font-weight="700" fill="#166534">EVIDENCE AUDIT</text>
    <text x="826" y="312" font-size="10.5" fill="#3a5c47">immutable per-model runs ·</text>
    <text x="826" y="326" font-size="10.5" fill="#3a5c47">raw + trajectory + SHA-256</text>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <rect x="180" y="440" width="660" height="42" rx="21" fill="#ffffff" stroke="#c9d2e2" stroke-width="2"/>
    <text x="510" y="467" font-size="15" font-weight="600" fill="#3b4a8c">9 local GGUF models · 23 API models · 672 task slots · seed 42 · temp 0</text>
  </g>
</svg>
