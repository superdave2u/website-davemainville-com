<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A pie chart with unequal slices showing an income-proportional split, with coins and a banknote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="slice-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#3b55e0"/>
    </linearGradient>
    <linearGradient id="slice-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78dced"/>
      <stop offset="1" stop-color="#4fc3dd"/>
    </linearGradient>
    <linearGradient id="slice-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6a0e9"/>
      <stop offset="1" stop-color="#d17fd6"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#bg)"/>

  <g transform="translate(430 255)">
    <g>
      <path d="M 0 0 L 0 -190 A 190 190 0 0 1 165.7 95 Z" fill="url(#slice-a)"/>
      <path d="M 0 0 L 165.7 95 A 190 190 0 0 1 -65.7 178.3 Z" fill="url(#slice-b)"/>
      <path d="M 0 0 L -65.7 178.3 A 190 190 0 0 1 0 -190 Z" fill="url(#slice-c)"/>
    </g>
    <circle cx="0" cy="0" r="62" fill="#ffffff"/>
    <circle cx="0" cy="0" r="58" fill="#f4f6ff"/>
    <text x="0" y="14" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="44" font-weight="700" fill="#3b4a8c">%</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.9">
    <circle cx="150" cy="380" r="38" fill="url(#coin)"/>
    <circle cx="215" cy="420" r="30" fill="url(#coin)"/>
    <circle cx="105" cy="455" r="22" fill="url(#coin)"/>
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-weight="700" fill="#8a6d1f" text-anchor="middle">
    <text x="150" y="393" font-size="34">$</text>
    <text x="215" y="432" font-size="26">$</text>
    <text x="105" y="464" font-size="19">$</text>
  </g>

  <g transform="translate(845 150) rotate(8)">
    <rect x="-95" y="-48" width="190" height="96" rx="10" fill="#5acda0" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="-77" y="-32" width="154" height="64" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="4 5"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" fill-opacity="0.85"/>
    <text x="0" y="10" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c6e53">$</text>
  </g>

  <g fill="#3b4a8c" fill-opacity="0.18">
    <circle cx="70" cy="90" r="10"/>
    <circle cx="120" cy="150" r="6"/>
    <circle cx="950" cy="330" r="9"/>
    <circle cx="900" cy="390" r="5"/>
    <circle cx="280" cy="70" r="7"/>
  </g>
</svg>
