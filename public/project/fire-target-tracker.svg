<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A FIRE status board: save-next-month headline card, a progress gauge, and a portfolio chart comparing the actual balance against the required glidepath and the projected path">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141d"/>
      <stop offset="1" stop-color="#171d2b"/>
    </linearGradient>
    <linearGradient id="fcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2434"/>
      <stop offset="1" stop-color="#1a2130"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#fbg)"/>

  <g>
    <rect x="60" y="64" width="420" height="150" rx="14" fill="url(#fcard)" stroke="#2c3a55" stroke-width="2"/>
    <text x="86" y="100" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#8fa3c7">SAVE NEXT MONTH</text>
    <text x="86" y="152" font-family="Roboto Mono, monospace" font-size="46" font-weight="700" fill="#4ade80">$1,720</text>
    <rect x="86" y="172" width="150" height="28" rx="14" fill="#14321f" stroke="#22c55e" stroke-width="1.5"/>
    <text x="161" y="191" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#4ade80">ON TRACK</text>
    <text x="256" y="191" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#8fa3c7">last saved $1,850</text>

    <g transform="translate(730 150)">
      <circle cx="0" cy="0" r="86" fill="none" stroke="#253248" stroke-width="18"/>
      <path d="M 0 -86 A 86 86 0 1 1 -60.8 60.8" fill="none" stroke="#4f6bff" stroke-width="18" stroke-linecap="round"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="30" font-weight="700" fill="#ffffff">64%</text>
      <text x="0" y="22" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#8fa3c7">of FIRE target</text>
    </g>
  </g>

  <g>
    <rect x="60" y="248" width="900" height="196" rx="14" fill="url(#fcard)" stroke="#2c3a55" stroke-width="2"/>
    <line x1="120" y1="392" x2="920" y2="392" stroke="#2c3a55" stroke-width="2"/>
    <line x1="120" y1="288" x2="920" y2="288" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="926" y="284" text-anchor="end" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#c9a55a">FIRE target</text>

    <path d="M 120 392 L 320 372 L 520 352 L 720 330 L 920 306" fill="none" stroke="#4f6bff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 120 392 L 320 366 L 520 338 L 720 306 L 920 270" fill="none" stroke="#4fc3dd" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 392 L 320 378 L 520 360 L 720 336 L 920 306" fill="none" stroke="#34a853" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>

    <g font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600">
      <circle cx="150" cy="270" r="5" fill="#4f6bff"/>
      <text x="162" y="275" fill="#9db2d9">actual portfolio</text>
      <circle cx="320" cy="270" r="5" fill="#4fc3dd"/>
      <text x="332" y="275" fill="#9db2d9">required glidepath</text>
      <circle cx="520" cy="270" r="5" fill="#34a853"/>
      <text x="532" y="275" fill="#9db2d9">projected path</text>
      <text x="920" y="414" text-anchor="end" font-size="12" fill="#5f6f8f">months →</text>
    </g>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <rect x="255" y="456" width="510" height="40" rx="20" fill="#131a29" stroke="#2c3a55" stroke-width="1.5"/>
    <text x="510" y="482" font-size="15" font-weight="600" fill="#8fa3c7">real dollars · local only · the required monthly number, headline</text>
  </g>
</svg>
