<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A dark presentation slide showing the five-step judgment loop — frame, compare, prove, constrain, own — with the quote 'the agent produced it is not a design decision' below">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#e6eaf6"/>
    </linearGradient>
    <linearGradient id="jslide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#jbg)"/>

  <rect x="110" y="64" width="800" height="366" rx="18" fill="url(#jslide)" stroke="#2c3a63" stroke-width="2"/>
  <text x="146" y="106" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7d8ec9">PLATFORM ENGINEERING WORKSHOP</text>

  <circle cx="510" cy="266" r="115" fill="none" stroke="#3a4a78" stroke-width="3" stroke-dasharray="7 8"/>
  <g fill="#0f1830" stroke="#4f6bff" stroke-width="3" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="510" cy="151" r="32"/>
    <circle cx="619" cy="231" r="32" stroke="#4fc3dd"/>
    <circle cx="578" cy="359" r="32" stroke="#4fc3dd"/>
    <circle cx="442" cy="359" r="32" stroke="#4fc3dd"/>
    <circle cx="401" cy="231" r="32" stroke="#4fc3dd"/>
    <text x="510" y="157" fill="#ffffff">01</text>
    <text x="619" y="237" fill="#ffffff">02</text>
    <text x="578" y="365" fill="#ffffff">03</text>
    <text x="442" y="365" fill="#ffffff">04</text>
    <text x="401" y="237" fill="#ffffff">05</text>
  </g>
  <g fill="#e6a04c" font-family="Roboto, Arial, sans-serif">
    <polygon points="0,-6 11,0 0,6" transform="translate(578 173) rotate(36)"/>
    <polygon points="0,-6 11,0 0,6" transform="translate(619 302) rotate(108)"/>
    <polygon points="0,-6 11,0 0,6" transform="translate(510 381) rotate(180)"/>
    <polygon points="0,-6 11,0 0,6" transform="translate(401 302) rotate(252)"/>
    <polygon points="0,-6 11,0 0,6" transform="translate(442 173) rotate(324)"/>
  </g>
  <g font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <text x="510" y="102" fill="#c9d4f2">Frame</text>
    <text x="712" y="236" fill="#c9d4f2">Compare</text>
    <text x="642" y="398" fill="#c9d4f2">Prove</text>
    <text x="378" y="398" fill="#c9d4f2">Constrain</text>
    <text x="308" y="236" fill="#c9d4f2">Own</text>
  </g>
  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="510" y="262" font-size="21" font-weight="700" fill="#ffffff">Good Judgment</text>
    <text x="510" y="284" font-size="13" fill="#7d8ec9">turns speed into a controlled experiment</text>
  </g>

  <rect x="130" y="404" width="640" height="5" rx="2.5" fill="#263159"/>
  <rect x="130" y="404" width="384" height="5" rx="2.5" fill="#4f6bff"/>
  <text x="874" y="412" text-anchor="end" font-family="Roboto Mono, monospace" font-size="14" fill="#7d8ec9">05 / 18</text>

  <g>
    <rect x="255" y="452" width="510" height="42" rx="21" fill="#ffffff" stroke="#e8a04c" stroke-width="2.5"/>
    <text x="510" y="479" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#8a6d3b">“The agent produced it” is not a design decision</text>
  </g>
</svg>
