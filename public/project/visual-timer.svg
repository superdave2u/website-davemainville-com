<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="A visual timer bar filling with an eased gradient from a sprout toward a growing tree goal, with theme dots and an easing curve inset">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#e2f4ea"/>
    </linearGradient>
    <linearGradient id="tfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.25" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="0.75" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#tbg)"/>

  <text x="60" y="252" font-size="54">🌱</text>
  <text x="856" y="268" font-size="86">🌳</text>

  <rect x="140" y="200" width="700" height="64" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <rect x="140" y="200" width="434" height="64" rx="18" fill="url(#tfill)"/>
  <rect x="140" y="200" width="700" height="64" rx="18" fill="none" stroke="#065f46" stroke-opacity="0.25" stroke-width="2"/>

  <line x1="774" y1="188" x2="774" y2="276" stroke="#059669" stroke-dasharray="6 6" stroke-width="3"/>
  <text x="774" y="176" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#059669">90% — the goal grows</text>

  <text x="554" y="242" text-anchor="end" font-family="Roboto Mono, monospace" font-size="30" font-weight="700" fill="#ffffff">03:47.25</text>
  <text x="554" y="310" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="600" fill="#065f46">eased fill: fast start, anticipatory finish</text>

  <g transform="translate(140 372)">
    <text x="0" y="0" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#065f46">Six themes:</text>
    <circle cx="110" cy="-6" r="14" fill="url(#rainbow)"/>
    <circle cx="150" cy="-6" r="14" fill="#60a5fa"/>
    <circle cx="190" cy="-6" r="14" fill="#34d399"/>
    <circle cx="230" cy="-6" r="14" fill="#fb923c"/>
    <circle cx="270" cy="-6" r="14" fill="#fbbf24"/>
    <circle cx="310" cy="-6" r="14" fill="#fb7185"/>
    <text x="335" y="0" font-family="Roboto, Arial, sans-serif" font-size="15" fill="#6b7280">each with a start icon and a growing goal</text>
  </g>

  <g transform="translate(620 360)">
    <text x="0" y="0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#6b7280">fill vs time</text>
    <line x1="0" y1="14" x2="0" y2="94" stroke="#9ca3af" stroke-width="2"/>
    <line x1="0" y1="94" x2="180" y2="94" stroke="#9ca3af" stroke-width="2"/>
    <line x1="0" y1="94" x2="180" y2="14" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 0 94 Q 40 30 90 24 T 180 14" fill="none" stroke="#10b981" stroke-width="4"/>
  </g>
</svg>
