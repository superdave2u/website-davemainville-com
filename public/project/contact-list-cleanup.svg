<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 510" role="img" aria-label="Contact records passing through a chain of filter handlers, with most kept in a safe zone and a few deleted, above a steady rate-limited call timeline">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="kept" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5acda0"/>
      <stop offset="1" stop-color="#3ba87e"/>
    </linearGradient>
    <linearGradient id="removed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#e05a52"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3dd"/>
      <stop offset="0.5" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#78dced"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="510" fill="url(#cbg)"/>

  <g font-family="Roboto, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <g>
      <rect x="60" y="80" width="190" height="64" rx="12" fill="#ffffff" stroke="url(#chain)" stroke-width="3"/>
      <text x="155" y="108" font-size="19" fill="#3b55e0">Phone &gt; 1 number</text>
      <text x="155" y="130" font-size="14" fill="#8a93b8">Handler 1</text>
      <line x1="250" y1="112" x2="300" y2="112" stroke="#4f6bff" stroke-width="4" marker-end="none"/>
      <polygon points="300,112 288,106 288,118" fill="#4f6bff"/>
    </g>
    <g>
      <rect x="305" y="80" width="190" height="64" rx="12" fill="#ffffff" stroke="url(#chain)" stroke-width="3"/>
      <text x="400" y="108" font-size="19" fill="#3b55e0">Labels &gt; 1</text>
      <text x="400" y="130" font-size="14" fill="#8a93b8">Handler 2</text>
      <line x1="495" y1="112" x2="545" y2="112" stroke="#4f6bff" stroke-width="4"/>
      <polygon points="545,112 533,106 533,118" fill="#4f6bff"/>
    </g>
    <g>
      <rect x="550" y="80" width="190" height="64" rx="12" fill="#ffffff" stroke="url(#chain)" stroke-width="3"/>
      <text x="645" y="108" font-size="19" fill="#3b55e0">Labeled phone no.</text>
      <text x="645" y="130" font-size="14" fill="#8a93b8">Handler 3</text>
      <line x1="740" y1="112" x2="790" y2="112" stroke="#4f6bff" stroke-width="4"/>
      <polygon points="790,112 778,106 778,118" fill="#4f6bff"/>
    </g>
    <g>
      <rect x="795" y="80" width="170" height="64" rx="12" fill="#ffffff" stroke="url(#chain)" stroke-width="3"/>
      <text x="880" y="108" font-size="19" fill="#b56cb9">Delete?</text>
      <text x="880" y="130" font-size="14" fill="#8a93b8">Final handler</text>
    </g>
  </g>

  <g>
    <rect x="70" y="190" width="400" height="180" rx="14" fill="#ffffff" stroke="#5acda0" stroke-width="3"/>
    <text x="270" y="225" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c6e53">Skipped — kept</text>
    <g stroke="url(#kept)" stroke-width="2.5" fill="#eafaf2">
      <circle cx="130" cy="270" r="22"/>
      <circle cx="195" cy="270" r="22"/>
      <circle cx="260" cy="270" r="22"/>
      <circle cx="325" cy="270" r="22"/>
      <circle cx="130" cy="335" r="22"/>
      <circle cx="195" cy="335" r="22"/>
      <circle cx="260" cy="335" r="22"/>
      <circle cx="325" cy="335" r="22"/>
    </g>
    <g font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c6e53" text-anchor="middle">
      <text x="130" y="276">J</text><text x="195" y="276">A</text><text x="260" y="276">M</text><text x="325" y="276">S</text>
      <text x="130" y="341">R</text><text x="195" y="341">K</text><text x="260" y="341">T</text><text x="325" y="341">L</text>
    </g>
  </g>

  <g>
    <rect x="550" y="190" width="400" height="180" rx="14" fill="#ffffff" stroke="#e05a52" stroke-width="3"/>
    <text x="750" y="225" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#b03a33">No hits — deleted</text>
    <g stroke="url(#removed)" stroke-width="2.5" fill="#fdeceb" stroke-dasharray="5 4">
      <circle cx="640" cy="290" r="22"/>
      <circle cx="710" cy="290" r="22"/>
      <circle cx="780" cy="290" r="22"/>
      <circle cx="850" cy="290" r="22"/>
    </g>
    <g font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#b03a33" text-anchor="middle">
      <text x="640" y="296">?</text><text x="710" y="296">?</text><text x="780" y="296">?</text><text x="850" y="296">?</text>
    </g>
  </g>

  <g font-family="Roboto, Arial, sans-serif" font-weight="600">
    <text x="70" y="435" font-size="17" fill="#3b4a8c">Rate-limited API calls — steady 90/min</text>
    <line x1="70" y1="480" x2="950" y2="480" stroke="#c3cbe8" stroke-width="3" stroke-linecap="round"/>
    <g fill="#4f6bff">
      <circle cx="90" cy="480" r="6"/><circle cx="150" cy="480" r="6"/><circle cx="210" cy="480" r="6"/><circle cx="270" cy="480" r="6"/><circle cx="330" cy="480" r="6"/><circle cx="390" cy="480" r="6"/><circle cx="450" cy="480" r="6"/><circle cx="510" cy="480" r="6"/><circle cx="570" cy="480" r="6"/><circle cx="630" cy="480" r="6"/><circle cx="690" cy="480" r="6"/><circle cx="750" cy="480" r="6"/><circle cx="810" cy="480" r="6"/><circle cx="870" cy="480" r="6"/><circle cx="930" cy="480" r="6"/>
    </g>
  </g>
</svg>
