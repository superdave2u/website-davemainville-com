        <text x="12" y="22" font-size="10.5" font-weight="700" fill="#3b4a8c">$</text>
        <rect x="24" y="13" width="7" height="11" rx="1.5" fill="#2337ff"/>
        <rect x="12" y="36" width="150" height="6" rx="3" fill="#4f6bff" fill-opacity="0.45"/>
        <rect x="12" y="50" width="190" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="64" width="120" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="78" width="170" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="92" width="90" height="6" rx="3" fill="#c3cbe8"/>
      </g>
      <g transform="translate(266 80)">
        <rect width="238" height="112" rx="8" fill="#4fc3dd" fill-opacity="0.09" stroke="#4fc3dd" stroke-width="1.5"/>
        <text x="12" y="22" font-size="10.5" font-weight="700" fill="#3b4a8c">$</text>
        <rect x="12" y="36" width="200" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="50" width="130" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="64" width="170" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="78" width="90" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="92" width="140" height="6" rx="3" fill="#c3cbe8"/>
      </g>
      <g transform="translate(16 204)">
        <rect width="238" height="112" rx="8" fill="#4fc3dd" fill-opacity="0.09" stroke="#4fc3dd" stroke-width="1.5"/>
        <text x="12" y="22" font-size="10.5" font-weight="700" fill="#3b4a8c">$</text>
        <rect x="12" y="36" width="140" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="50" width="190" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="64" width="110" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="78" width="180" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="92" width="70" height="6" rx="3" fill="#c3cbe8"/>
      </g>
      <g transform="translate(266 204)">
        <rect width="238" height="112" rx="8" fill="#4f6bff" fill-opacity="0.06" stroke="#4f6bff" stroke-width="1.5"/>
        <text x="12" y="22" font-size="10.5" font-weight="700" fill="#3b4a8c">$</text>
        <rect x="24" y="13" width="7" height="11" rx="1.5" fill="#2337ff"/>
        <rect x="12" y="36" width="180" height="6" rx="3" fill="#4f6bff" fill-opacity="0.45"/>
        <rect x="12" y="50" width="140" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="64" width="200" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="78" width="120" height="6" rx="3" fill="#c3cbe8"/>
        <rect x="12" y="92" width="160" height="6" rx="3" fill="#c3cbe8"/>
      </g>
    </g>

    <g text-anchor="middle">
      <rect x="527" y="446" width="96" height="26" rx="13" fill="#ffffff" stroke="#c9d4e2" stroke-width="2"/>
      <text x="575" y="463" font-size="10" font-weight="700" fill="#3b4a8c">tmux tabs</text>
      <rect x="635" y="446" width="118" height="26" rx="13" fill="#ffffff" stroke="#c9d4e2" stroke-width="2"/>
      <text x="694" y="463" font-size="10" font-weight="700" fill="#3b4a8c">remote attach</text>
      <rect x="765" y="446" width="108" height="26" rx="13" fill="#ffffff" stroke="#c9d4e2" stroke-width="2"/>
      <text x="819" y="463" font-size="10" font-weight="700" fill="#3b4a8c">ralph loops</text>
    </g>
  </g>
</svg>
